{% extends "base.html" %}
{% block title %}Iniciar sesión | Control de Gastos{% endblock %}
{% block content %}
<div class="login-wrap">
  <section class="login-card">
    <div class="brand-mark">ₛ/</div>
    <p class="eyebrow">CONTROL PERSONAL</p>
    <h1 class="h3 fw-bold mb-2">Bienvenido</h1>
    <p class="text-muted mb-4">Ingresa para administrar tus gastos.</p>
    <form method="post">
      <label class="form-label">Usuario</label>
      <input class="form-control form-control-lg mb-3" name="username" placeholder="Ingresa tu usuario" required autofocus>
      <label class="form-label">Contraseña</label>
      <input class="form-control form-control-lg mb-4" type="password" name="password" placeholder="Ingresa tu contraseña" required>
      <button class="btn btn-primary btn-lg w-100">Ingresar al sistema</button>
    </form>
    <div class="demo-note mt-4"><strong>Acceso de práctica:</strong> admin / 123</div>
  </section>
</div>
{% endblock %}
